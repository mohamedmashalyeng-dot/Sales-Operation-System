<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/styles.css">
<title>Kent Business College - Offline</title>
</head>
<body>
<main class="loading-screen">
<img src="/kent-logo-full-dark.png" width="220" alt="Kent Business College">
<h1>You're offline</h1>
<p>Reconnect to access your workspace securely. Changes need a connection to save.</p>
<a class="button primary" href="/">Try again</a>
</main>
<script>
if (['localhost','127.0.0.1','0.0.0.0'].includes(location.hostname) && 'serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(registrations => Promise.all(registrations.map(registration => registration.unregister())))
    .then(() => 'caches' in window ? caches.keys().then(keys => Promise.all(keys.filter(key => key.startsWith('pathway-')).map(key => caches.delete(key)))) : null)
    .then(() => location.replace('/index.html'))
    .catch(() => {});
}
</script>
</body>
</html>
